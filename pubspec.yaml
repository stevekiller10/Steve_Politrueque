name: trueque
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  flutter_easyloading: ^3.0.5 
  sign_in_with_apple: ^4.3.0

  # Firebase y Notificaciones Push
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1

  # Geolocalización y Mapas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  permission_handler: ^11.0.1

  # Manejo de entorno y archivos
  flutter_dotenv: ^6.0.0
  image_picker: ^1.2.1
  path_provider: ^2.1.3
  file_picker: ^8.1.3

  # Red y Backend (Supabase)
  dio: ^5.9.0
  supabase_flutter: ^2.3.0
  postgrest: ^2.5.0
  http: ^1.6.0

  # Autenticación y Almacenamiento Seguro
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  supabase_auth_ui: ^0.5.5
  shared_preferences: ^2.3.2

  # Utilidades de UI y Tiempo
  app_links: ^6.4.1
  timeago: ^3.6.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.3"
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ACB8BE"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/logogoogle.png

dependency_overrides:
  sign_in_with_apple: ^6.1.1
  shared_preferences_android: 2.3.1
  shared_preferences: ^2.3.2
